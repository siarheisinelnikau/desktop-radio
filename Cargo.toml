[package]
name = "desktop-radio"
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
description = "Portable Windows tray internet radio with a ten-band equalizer"
license = "GPL-3.0-only"
repository = "https://github.com/siarheisinelnikau/desktop-radio"

[[bin]]
name = "DesktopRadio"
path = "src/main.rs"

[dependencies]
anyhow = "1"
png = "0.18"
rustfft = "6.4"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
symphonia = { version = "0.5.5", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
time = { version = "0.3", features = ["parsing"] }
unicode-normalization = "0.1"
url = "2.5"
windows = { version = "0.62", features = ["Media", "Win32_Foundation", "Win32_System_WinRT"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus",
    "Win32_Media_Audio", "Win32_Media_Multimedia", "Win32_Networking_WinHttp", "Win32_Security", "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemInformation",
    "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true
